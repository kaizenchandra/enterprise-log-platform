services:
  postgres:
    image: postgres:17-alpine
    environment: { POSTGRES_DB: logs, POSTGRES_USER: logs, POSTGRES_PASSWORD: local-only }
    volumes: [ "postgres:/var/lib/postgresql/data" ]
    healthcheck: { test: [ CMD-SHELL, "pg_isready -U logs" ], interval: 5s, retries: 20 }
  kafka-volume-init:
    image: apache/kafka:4.0.0
    user: "0:0"
    entrypoint: [ "sh", "-c", "chown -R 1000:1000 /data" ]
    volumes: [ "kafka:/data" ]
  kafka:
    depends_on:
      kafka-volume-init: { condition: service_completed_successfully }
    image: apache/kafka:4.0.0
    environment:
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      KAFKA_NUM_PARTITIONS: 12
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_LOG_RETENTION_HOURS: 24
    volumes: [ "kafka:/tmp/kraft-combined-logs" ]
  opensearch:
    image: opensearchproject/opensearch:3.3.2
    environment: { discovery.type: single-node, DISABLE_SECURITY_PLUGIN: 'true', OPENSEARCH_JAVA_OPTS: '-Xms512m -Xmx512m', DISABLE_INSTALL_DEMO_CONFIG: 'true' }
    volumes: [ "search:/usr/share/opensearch/data" ]
  object-storage:
    image: chrislusf/seaweedfs:3.80
    command: [ server, -dir=/data, -ip=object-storage, -s3, -s3.config=/etc/seaweedfs/s3.json ]
    volumes: [ "archive:/data", "./infrastructure/object-storage/s3.json:/etc/seaweedfs/s3.json:ro" ]
  api:
    build: backend
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/logs
      KAFKA_SERVERS: kafka:9092
      SEARCH_URL: http://opensearch:9200
      S3_ENDPOINT: http://object-storage:8333
      NOTIFICATION_URL: http://payment-service:8080/notifications
      NOTIFICATION_SECRET: local-notification-key
      OIDC_JWK_URL: http://keycloak:8080/realms/logs/protocol/openid-connect/certs
    ports: [ "127.0.0.1:8080:8080" ]
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_started }
      opensearch: { condition: service_started }
  frontend:
    build: frontend
    environment: { BACKEND_URL: 'http://api:8080', PUBLIC_ORIGIN: 'http://127.0.0.1:3100' }
    ports: [ "127.0.0.1:3100:3000" ]
  keycloak:
    image: quay.io/keycloak/keycloak:26.4
    command: [ start-dev, --import-realm ]
    volumes: [ "./infrastructure/keycloak:/opt/keycloak/data/import:ro" ]
    ports: [ "127.0.0.1:8180:8080" ]
  collector:
    user: "0:0" # Local volume bootstrap only; production needs an owned encrypted volume.
    image: otel/opentelemetry-collector-contrib:0.140.0
    command: [ "--config=/etc/otel.yaml" ]
    volumes: [ "./infrastructure/otel-collector/config.yaml:/etc/otel.yaml:ro", "collector:/var/lib/otel" ]
    environment: { INGESTION_KEY: '${INGESTION_KEY:-register-a-source-first}' }
    ports: [ "127.0.0.1:4317:4317", "127.0.0.1:4318:4318" ]
  order-service:
    build: demo-services
    environment: { SERVICE_NAME: 'order-service', COLLECTOR_URL: 'http://collector:4318' }
    depends_on: [ collector ]
  payment-service:
    build: demo-services
    environment: { SERVICE_NAME: 'payment-service', COLLECTOR_URL: 'http://collector:4318' }
    depends_on: [ collector ]
  inventory-service:
    build: demo-services
    environment: { SERVICE_NAME: 'inventory-service', COLLECTOR_URL: 'http://collector:4318' }
    depends_on: [ collector ]
volumes: { archive: { }, postgres: { }, kafka: { }, search: { }, collector: { } }
