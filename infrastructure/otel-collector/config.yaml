extensions:
  file_storage:
    directory: /var/lib/otel
receivers:
  otlp:
    protocols:
      grpc: { endpoint: '0.0.0.0:4317' }
      http: { endpoint: '0.0.0.0:4318' }
processors:
  memory_limiter: { check_interval: 1s, limit_mib: 128, spike_limit_mib: 32 }
  batch: { send_batch_size: 100, send_batch_max_size: 500, timeout: 1s }
exporters:
  otlphttp:
    endpoint: http://api:8080
    encoding: json
    compression: none
    headers: { X-Ingestion-Key: '${env:INGESTION_KEY}' }
    sending_queue: { enabled: true, queue_size: 1000, storage: file_storage }
    retry_on_failure: { enabled: true, initial_interval: 1s, max_interval: 10s, max_elapsed_time: 300s }
service:
  extensions: [ file_storage ]
  pipelines:
    logs: { receivers: [ otlp ], processors: [ memory_limiter, batch ], exporters: [ otlphttp ] }
